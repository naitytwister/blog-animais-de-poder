[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Headers de segurança e cache ───────────────────────────────
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Redirecionamentos 301 ───────────────────────────────────────
[[redirects]]
  from = "/posts/o-rio-dentro-do-sonho-o-que-significa-sonhar-com-peixe/"
  to = "/posts/o-que-significa-sonhar-com-peixe/"
  status = 301
  force = true

# Post antigo do quiz substituído pela ferramenta interativa
[[redirects]]
  from = "/posts/teste-do-xamanismo/"
  to = "/quiz/animal-de-poder/"
  status = 301
  force = true

# Posts-teste antigos substituídos pela ferramenta interativa
[[redirects]]
